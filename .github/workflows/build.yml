name: 云端编译车机投屏 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 编译接收端 Debug APK
        run: gradle :receiver:assembleDebug --no-daemon --no-watch-fs

      - name: 编译发送端 Debug APK
        run: gradle :sender:assembleDebug --no-daemon --no-watch-fs

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: carcast-apks
          path: |
            receiver/build/outputs/apk/debug/*.apk
            sender/build/outputs/apk/debug/*.apk
