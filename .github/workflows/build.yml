name: build-apks

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Build
        run: gradle :phone:assembleDebug :car:assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          cp phone/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp car/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          ls -l out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: carmirror-apks
          path: out/*.apk
