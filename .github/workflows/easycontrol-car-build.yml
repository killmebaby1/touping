name: 云端编译车机投屏 APK (Easycontrol 深度定制)
on:
  workflow_dispatch:
  push:
    branches: [easycontrol-car]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 编译车机端 APK
        working-directory: ./easycontrol_car/easycontrol
        run: |
          chmod +x gradlew
          ./gradlew :server:assembleRelease --no-daemon --stacktrace
          ls -la server/build/outputs/apk/release/
          cp server/build/outputs/apk/release/server-release*.apk app/src/main/res/raw/easycontrol_server.jar
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: carcast-car-apk
          path: easycontrol_car/easycontrol/app/build/outputs/apk/debug/*.apk