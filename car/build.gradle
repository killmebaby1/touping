plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lynkcast.mirror.car'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lynkcast.mirror.car'
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName "1.1.0"
    }

    // 与手机端使用同一把固定密钥，保证每次 CI 出的包都能直接覆盖安装
    signingConfigs {
        fixed {
            storeFile file('../keystore/carmirror.jks')
            storePassword 'carmirror123'
            keyAlias 'carmirror'
            keyPassword 'carmirror123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}