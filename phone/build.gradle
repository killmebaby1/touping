plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lynkcast.mirror.phone'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lynkcast.mirror.phone'
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName "1.1.0"
    }

    // 固定签名：CI 每次都是全新机器，用自动生成的 debug 密钥会让每次包的签名都不一样，
    // 只能卸载再装。这里改用仓库内固定的 keystore，保证任何一次构建都能覆盖升级。
    signingConfigs {
        fixed {
            storeFile file('../keystore/carmirror.jks')
            storePassword 'carmirror123'
            keyAlias 'carmirror'
            keyPassword 'carmirror123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}